name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter 3.19.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Generate Fresh Project & Merge
        run: |
          cd ..
          flutter create --org com.jyotishvastu.ayurveda ayurveda_app
          cp -f ayurveda-academy/pubspec.yaml ayurveda_app/
          cp -f ayurveda-academy/lib/main.dart ayurveda_app/lib/main.dart
          cd ayurveda_app
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk ../ayurveda-academy/

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Ayurveda_Academy_App
          path: app-release.apk
